# DOSBox settings for Ultima III: Exodus on the New 3DS (u3-3ds)
[sdl]
fullscreen=false
output=surface

[dosbox]
machine=svga_s3
memsize=4

[render]
frameskip=0
aspect=false
scaler=none

[cpu]
core=dynamic
cputype=auto
cycles=fixed 3000

[mixer]
nosound=false
rate=22050
blocksize=1024
prebuffer=80

[midi]
mpu401=none
mididevice=none

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=opl2
oplemu=fast
oplrate=22050

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=22050
tandy=off
disney=false

[joystick]
joysticktype=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
@echo off
mount c sdmc:/3ds/u3-3ds/game
c:
cls
ultima3.com
exit
